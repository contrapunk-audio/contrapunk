[package]
name = "contrapunk-tauri"
version = "1.3.1"
edition = "2021"
description = "Tauri v2 backend for Contrapunk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
contrapunk = { path = ".." }
contrapunk-companion = { path = "../crates/contrapunk-companion" }
midir = "0.11"
cpal = "0.18"
wmidi = "4.0"
ringbuf = "0.5"
