[package]
name = "contrapunk-tauri"
version = "0.1.0"
edition = "2021"
description = "Tauri v2 backend for Contrapunk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
contrapunk = { path = ".." }
midir = "0.10"
cpal = "0.15"
wmidi = "4.0"
rand = "0.8"
