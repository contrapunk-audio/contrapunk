name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build macOS universal .dmg (Monterey 12.0+ compatible)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable + macOS + wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin,wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-tauri
          workspaces: |
            .
            src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI (explicit, pre-tauri)
        working-directory: ui
        run: npm run build

      - name: Build Tauri app (universal-apple-darwin)
        working-directory: src-tauri
        env:
          CARGO_TERM_COLOR: always
        run: cargo tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Upload universal .dmg
        uses: actions/upload-artifact@v7
        with:
          name: contrapunk-macos-universal-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload .app bundle (unpacked, for dev debugging)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contrapunk-macos-universal-app
          path: target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: ignore
          retention-days: 14
