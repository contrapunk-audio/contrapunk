name: macOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build macOS universal .dmg (Monterey 12.0+ compatible)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Surface secrets to env so steps can gate on `if: env.X != ''`.
      # `${{ secrets.X }}` is NOT available in `if:` directly; round-tripping
      # through env is the GitHub-recommended pattern. Fork PRs see empty
      # strings and the signing/notarization steps short-circuit gracefully
      # so unsigned builds still succeed for testing.
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable + macOS + wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin,wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-tauri
          workspaces: |
            .
            src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI (explicit, pre-tauri)
        working-directory: ui
        run: npm run build

      # === Codesigning + notarization setup ============================
      # Only runs when the Developer ID certificate secret is present.
      # Fork PRs / first-time runs without secrets skip these steps and
      # produce an unsigned build (useful for code review, useless for
      # distribution).

      - name: Import Apple Developer ID certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write App Store Connect API key
        if: env.APPLE_API_KEY_BASE64 != ''
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${APPLE_API_KEY_BASE64}" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          chmod 600 "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Verify signing setup
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          security find-identity -v -p codesigning
          echo "Signing identity: ${APPLE_SIGNING_IDENTITY:-<unset>}"
          echo "Team ID: ${APPLE_TEAM_ID:-<unset>}"
          echo "Notarization key path: ${APPLE_API_KEY_PATH:-<unset>}"

      - name: Build Tauri app (universal-apple-darwin)
        working-directory: src-tauri
        env:
          CARGO_TERM_COLOR: always
        run: |
          # Dependabot and fork PRs receive no secrets. Tauri treats an
          # exported-but-empty identity as a request to sign, so remove the
          # variables entirely for unsigned PR validation builds.
          if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            unset APPLE_SIGNING_IDENTITY APPLE_TEAM_ID
          fi
          if [[ -z "${APPLE_API_KEY_BASE64:-}" ]]; then
            unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          fi
          cargo tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Verify signature on built .app (strict on tagged releases)
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          APP_PATH="target/universal-apple-darwin/release/bundle/macos/Contrapunk.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" | head -20
          spctl --assess --type execute --verbose "$APP_PATH"

      - name: Notarize + staple DMG
        if: env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_API_KEY != '' && env.APPLE_API_ISSUER != '' && env.APPLE_API_KEY_BASE64 != ''
        run: |
          DMG_PATH=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify signature + staple on built .dmg (strict on tagged releases)
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          DMG_PATH=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          codesign --verify --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG_PATH"

      - name: Require signing + notarization on tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_BASE64
          do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing release secret: %s\n' "${missing[@]}"
            echo "::error::Refusing to attach unsigned/unnotarized DMG to release. Set Apple release secrets and retag."
            exit 1
          fi
          echo "Signing identity present: ${APPLE_SIGNING_IDENTITY}"

      - name: Upload universal .dmg
        uses: actions/upload-artifact@v7
        with:
          name: contrapunk-macos-universal-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload .app bundle (unpacked, for dev debugging)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contrapunk-macos-universal-app
          path: target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach .dmg to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
