name: Plugin Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'au-wrapper/**'
      - 'plugin/**'
      - 'crates/elixir-core/**'
      - 'crates/elixir-plugin/**'
      - 'packaging/**'
      - 'ui/**'
      - 'wasm/**'
      - 'bundler.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/plugin-build.yml'
  workflow_dispatch:

jobs:
  macos-plugins:
    name: Build signed macOS plugin installer
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable + macOS + wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin,wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-plugin
          workspaces: |
            .
            src-tauri

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI for embedded plugin editor
        working-directory: ui
        run: npm run build

      - name: Import Developer ID Application certificate
        id: import-app-cert
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - name: Import Developer ID Installer certificate
        if: env.APPLE_INSTALLER_CERTIFICATE_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: signing_temp
          create-keychain: false
          keychain-password: ${{ steps.import-app-cert.outputs.keychain-password }}
          p12-file-base64: ${{ env.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          p12-password: ${{ env.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}

      - name: Write App Store Connect API key
        if: env.APPLE_API_KEY_BASE64 != ''
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${APPLE_API_KEY_BASE64}" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          chmod 600 "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Require signing + notarization secrets on tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_SIGNING_IDENTITY \
            APPLE_INSTALLER_CERTIFICATE_BASE64 \
            APPLE_INSTALLER_CERTIFICATE_PASSWORD \
            APPLE_INSTALLER_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_BASE64
          do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing release secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Build universal Contrapunk + Elixir VST3/CLAP
        env:
          CONTRAPUNK_PLUGIN_UI_DIR: ${{ github.workspace }}/ui/build
        run: |
          cargo xtask bundle-universal contrapunk_plugin --release --features embed-ui
          cargo xtask bundle-universal elixir-plugin --release --features embed-ui

      - name: Sign and verify VST3 + CLAP bundles
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          for bundle in \
            target/bundled/Contrapunk.vst3 \
            target/bundled/Contrapunk.clap \
            target/bundled/elixir-plugin.vst3 \
            target/bundled/elixir-plugin.clap
          do
            codesign --force --deep --options runtime -s "$APPLE_SIGNING_IDENTITY" "$bundle"
            codesign --verify --deep --strict "$bundle"
          done

      - name: Verify macOS plugin bundle integrity
        run: |
          for bundle in \
            target/bundled/Contrapunk.vst3 \
            target/bundled/Contrapunk.clap \
            target/bundled/elixir-plugin.vst3 \
            target/bundled/elixir-plugin.clap
          do
            codesign --verify --deep --strict "$bundle"
          done

      - name: Build AU wrapper
        env:
          CONTRAPUNK_PLUGIN_UI_DIR: ${{ github.workspace }}/ui/build
        run: CODESIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}" ./au-wrapper/build.sh

      - name: Build selectable macOS plugin installer
        run: |
          set -euo pipefail
          python3 packaging/test_installers.py
          VERSION=$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('plugin/Cargo.toml', 'rb'))['package']['version'])
          PY
          )
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi

          CORE_ROOT="dist/pkgroot-contrapunk"
          ELIXIR_ROOT="dist/pkgroot-elixir"
          COMPONENTS="dist/component-packages"
          SCRIPTS="dist/macos-plugin-scripts"
          RAW="dist/macos-plugin-bundles"
          DIST="dist/Distribution.xml"
          PKG="dist/Contrapunk-Elixir-Plugins-macOS-universal.pkg"
          ZIP="dist/Contrapunk-Elixir-Plugins-macOS-universal-bundles.zip"

          rm -rf dist
          mkdir -p \
            "$CORE_ROOT/Library/Audio/Plug-Ins/VST3" \
            "$CORE_ROOT/Library/Audio/Plug-Ins/CLAP" \
            "$CORE_ROOT/Library/Audio/Plug-Ins/Components" \
            "$ELIXIR_ROOT/Library/Audio/Plug-Ins/VST3" \
            "$ELIXIR_ROOT/Library/Audio/Plug-Ins/CLAP" \
            "$COMPONENTS" "$SCRIPTS" \
            "$RAW/Contrapunk/VST3" "$RAW/Contrapunk/CLAP" "$RAW/Contrapunk/Audio Units" \
            "$RAW/Elixir/VST3" "$RAW/Elixir/CLAP"

          ditto target/bundled/Contrapunk.vst3 "$CORE_ROOT/Library/Audio/Plug-Ins/VST3/Contrapunk.vst3"
          ditto target/bundled/Contrapunk.clap "$CORE_ROOT/Library/Audio/Plug-Ins/CLAP/Contrapunk.clap"
          ditto au-wrapper/build/Contrapunk.component "$CORE_ROOT/Library/Audio/Plug-Ins/Components/Contrapunk.component"
          ditto "au-wrapper/build/Contrapunk Guitar.component" "$CORE_ROOT/Library/Audio/Plug-Ins/Components/Contrapunk Guitar.component"
          ditto target/bundled/elixir-plugin.vst3 "$ELIXIR_ROOT/Library/Audio/Plug-Ins/VST3/Elixir.vst3"
          ditto target/bundled/elixir-plugin.clap "$ELIXIR_ROOT/Library/Audio/Plug-Ins/CLAP/Elixir.clap"
          chmod -R a+rX "$CORE_ROOT" "$ELIXIR_ROOT"

          cat > "$SCRIPTS/postinstall" <<'SH'
          #!/bin/sh
          /usr/bin/killall -9 AudioComponentRegistrar >/dev/null 2>&1 || true
          exit 0
          SH
          chmod +x "$SCRIPTS/postinstall"

          core_args=(--root "$CORE_ROOT" --scripts "$SCRIPTS" --identifier com.contrapunk.plugins.core --version "$VERSION" --install-location /)
          elixir_args=(--root "$ELIXIR_ROOT" --identifier com.contrapunk.plugins.elixir --version "$VERSION" --install-location /)
          if [[ -n "${APPLE_INSTALLER_SIGNING_IDENTITY:-}" ]]; then
            core_args+=(--sign "$APPLE_INSTALLER_SIGNING_IDENTITY")
            elixir_args+=(--sign "$APPLE_INSTALLER_SIGNING_IDENTITY")
          fi
          pkgbuild "${core_args[@]}" "$COMPONENTS/Contrapunk.pkg"
          pkgbuild "${elixir_args[@]}" "$COMPONENTS/Elixir.pkg"

          sed "s/@VERSION@/$VERSION/g" packaging/macos/Distribution.xml.in > "$DIST"
          xmllint --noout "$DIST"
          product_args=(--distribution "$DIST" --package-path "$COMPONENTS")
          if [[ -n "${APPLE_INSTALLER_SIGNING_IDENTITY:-}" ]]; then
            product_args+=(--sign "$APPLE_INSTALLER_SIGNING_IDENTITY")
          fi
          productbuild "${product_args[@]}" "$PKG"

          ditto target/bundled/Contrapunk.vst3 "$RAW/Contrapunk/VST3/Contrapunk.vst3"
          ditto target/bundled/Contrapunk.clap "$RAW/Contrapunk/CLAP/Contrapunk.clap"
          ditto au-wrapper/build/Contrapunk.component "$RAW/Contrapunk/Audio Units/Contrapunk.component"
          ditto "au-wrapper/build/Contrapunk Guitar.component" "$RAW/Contrapunk/Audio Units/Contrapunk Guitar.component"
          ditto target/bundled/elixir-plugin.vst3 "$RAW/Elixir/VST3/Elixir.vst3"
          ditto target/bundled/elixir-plugin.clap "$RAW/Elixir/CLAP/Elixir.clap"
          cp packaging/macos/uninstall.sh "$RAW/uninstall.sh"
          (cd "$RAW" && zip -qry "../$(basename "$ZIP")" .)

      - name: Notarize + staple macOS plugin installer
        if: env.APPLE_API_KEY_BASE64 != '' && env.APPLE_INSTALLER_SIGNING_IDENTITY != ''
        run: |
          PKG="dist/Contrapunk-Elixir-Plugins-macOS-universal.pkg"
          xcrun notarytool submit "$PKG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"

      - name: Verify macOS component and product packages
        run: |
          set -euo pipefail
          for pkg in \
            dist/component-packages/Contrapunk.pkg \
            dist/component-packages/Elixir.pkg \
            dist/Contrapunk-Elixir-Plugins-macOS-universal.pkg
          do
            pkgutil --check-signature "$pkg" || {
              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then exit 1; fi
              echo "Unsigned pkg allowed for non-tag build: $pkg"
            }
          done

      - name: Upload macOS plugin installer
        uses: actions/upload-artifact@v7
        with:
          name: contrapunk-elixir-plugins-macos-universal-pkg
          path: dist/Contrapunk-Elixir-Plugins-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS raw plugin bundles
        uses: actions/upload-artifact@v7
        with:
          name: contrapunk-elixir-plugins-macos-universal-bundles
          path: dist/Contrapunk-Elixir-Plugins-macOS-universal-bundles.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach macOS plugins to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Contrapunk-Elixir-Plugins-macOS-universal.pkg
            dist/Contrapunk-Elixir-Plugins-macOS-universal-bundles.zip
          fail_on_unmatched_files: true

  windows-plugins:
    name: Build Windows plugin installer
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-plugin
          workspaces: |
            .
            src-tauri

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI for embedded plugin editor
        working-directory: ui
        run: npm run build

      - name: Build Contrapunk + Elixir VST3/CLAP
        env:
          CONTRAPUNK_PLUGIN_UI_DIR: ${{ github.workspace }}\ui\build
        run: |
          cargo xtask bundle contrapunk_plugin --release --features embed-ui
          cargo xtask bundle elixir-plugin --release --features embed-ui

      - name: Require Windows signing secrets on tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Windows signing certificate and password are required for tagged plugin releases'
          }

      - name: Sign and verify Windows plugin bundles
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllBytes('windows-signing.pfx', [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath 'windows-signing.pfx' -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $env:WINDOWS_CERTIFICATE_THUMBPRINT | Select-Object -First 1
          }
          if (-not $cert) { throw 'Windows signing certificate not found' }
          $files = Get-ChildItem target\bundled\Contrapunk.vst3,target\bundled\Contrapunk.clap,target\bundled\elixir-plugin.vst3,target\bundled\elixir-plugin.clap -Recurse -File |
            Where-Object { $_.Extension -in '.vst3', '.clap' }
          foreach ($file in $files) {
            $signature = Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
            if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($file.FullName)" }
          }
          "WINDOWS_SIGNING_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item windows-signing.pfx

      - name: Build Windows plugin installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python packaging/test_installers.py
          $payload = 'dist\windows-plugin\payload'
          $out = "${{ github.workspace }}\dist\Contrapunk-Elixir-Plugins-Windows-x64.exe"
          New-Item -ItemType Directory -Force `
            "$payload\Contrapunk\VST3", "$payload\Contrapunk\CLAP", `
            "$payload\Elixir\VST3", "$payload\Elixir\CLAP" | Out-Null
          Copy-Item -Recurse -Force 'target\bundled\Contrapunk.vst3' "$payload\Contrapunk\VST3\Contrapunk.vst3"
          Copy-Item -Recurse -Force 'target\bundled\Contrapunk.clap' "$payload\Contrapunk\CLAP\Contrapunk.clap"
          Copy-Item -Recurse -Force 'target\bundled\elixir-plugin.vst3' "$payload\Elixir\VST3\Elixir.vst3"
          Copy-Item -Recurse -Force 'target\bundled\elixir-plugin.clap' "$payload\Elixir\CLAP\Elixir.clap"
          Compress-Archive -Force -Path "$payload\*" -DestinationPath 'dist\Contrapunk-Elixir-Plugins-Windows-x64-bundles.zip'

          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $makensis `
            "/DOUTFILE=$out" `
            "/DCONTRAPUNK_VST3=$((Resolve-Path "$payload\Contrapunk\VST3\Contrapunk.vst3").Path)" `
            "/DCONTRAPUNK_CLAP=$((Resolve-Path "$payload\Contrapunk\CLAP\Contrapunk.clap").Path)" `
            "/DELIXIR_VST3=$((Resolve-Path "$payload\Elixir\VST3\Elixir.vst3").Path)" `
            "/DELIXIR_CLAP=$((Resolve-Path "$payload\Elixir\CLAP\Elixir.clap").Path)" `
            'packaging\windows\ContrapunkPlugins.nsi'

      - name: Sign and verify Windows plugin installer
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $env:WINDOWS_SIGNING_CERT_THUMBPRINT | Select-Object -First 1
          if (-not $cert) { throw 'Imported Windows signing certificate not found' }
          $signature = Set-AuthenticodeSignature -FilePath 'dist\Contrapunk-Elixir-Plugins-Windows-x64.exe' -Certificate $cert -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
          if ($signature.Status -ne 'Valid') { throw 'Windows installer signature is invalid' }

      - name: Upload Windows plugin installer
        uses: actions/upload-artifact@v7
        with:
          name: contrapunk-elixir-plugins-windows-x64-installer
          path: dist/Contrapunk-Elixir-Plugins-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows raw plugin bundles
        uses: actions/upload-artifact@v7
        with:
          name: contrapunk-elixir-plugins-windows-x64-bundles
          path: dist/Contrapunk-Elixir-Plugins-Windows-x64-bundles.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach Windows plugins to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Contrapunk-Elixir-Plugins-Windows-x64.exe
            dist/Contrapunk-Elixir-Plugins-Windows-x64-bundles.zip
          fail_on_unmatched_files: true
