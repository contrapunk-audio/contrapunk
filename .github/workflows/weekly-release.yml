name: Patch Release

on:
  workflow_dispatch: # Manual trigger only

jobs:
  check-changes:
    name: Check for bugfixes since last release
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get last release tag
        id: last_release
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check for bugfix/CVE commits only
        id: check
        env:
          LAST_TAG: ${{ steps.last_release.outputs.tag }}
        run: |
          if [ -z "$LAST_TAG" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No previous release — skip weekly patch (use monthly for first release)"
            exit 0
          fi

          # Only look for fix: and security-related commits
          FIX_COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline --grep="^fix" --grep="^security" --grep="CVE" -- \
            src/ plugin/ wasm/ src-tauri/ ui/src/ Cargo.toml Cargo.lock)
          if [ -n "$FIX_COMMITS" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Bugfixes found since ${LAST_TAG}:"
            echo "$FIX_COMMITS"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No bugfixes since ${LAST_TAG}"
          fi

      - name: Compute patch version
        id: version
        if: steps.check.outputs.has_changes == 'true'
        env:
          LAST_TAG: ${{ steps.last_release.outputs.tag }}
        run: |
          # Parse last tag: v1.2.3 → bump patch → v1.2.4
          if [[ "$LAST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            NEW_PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          else
            # Fallback: date-based
            VERSION="v1.0.1"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Patch version: $VERSION"

  release:
    name: Create Patch Release
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate release notes (bugfixes only)
        env:
          LAST_TAG: ${{ steps.last_release.outputs.tag || '' }}
          VERSION: ${{ needs.check-changes.outputs.version }}
          CODENAME: ""
          RELEASE_TYPE: "patch"
        run: |
          python3 scripts/release-notes.py > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-changes.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "Contrapunk ${VERSION}" \
            --notes-file /tmp/release-notes.md
