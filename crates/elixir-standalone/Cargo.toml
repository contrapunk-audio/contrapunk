[package]
name = "elixir-standalone"
version = "0.0.1"
edition = "2021"
description = "Elixir standalone synthesizer — desktop app (Phase 21.B0)."
authors = ["Contrapunk Team"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "elixir-standalone"
path = "src/main.rs"

[dependencies]
elixir-core = { path = "../elixir-core" }
elixir-preset = { path = "../elixir-preset" }
cpal = "0.17"
midir = "0.11"
anyhow = "1.0"
# UI (Phase 21.B6). Default features only; we don't need persistence
# or web rendering for the standalone desktop binary.
eframe = { version = "0.27", default-features = false, features = [
    "default_fonts",
    "glow",
] }
