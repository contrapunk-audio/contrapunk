[package]
name = "contrapunk-audio"
version = "1.1.0"
edition = "2021"
description = "Audio DSP + guitar→MIDI pipeline"
authors = ["Contrapunk Team"]

[lib]
name = "contrapunk_audio"
path = "src/lib.rs"

[dependencies]
wmidi = "4.0"
serde = { version = "1.0", features = ["derive"] }
ringbuf = "0.5"
pitch-detection = "0.3"
serde_json = "1.0"

[dev-dependencies]
hound = "3.5"
