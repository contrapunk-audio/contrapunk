[package]
name = "elixir-preset"
version = "0.0.1"
edition = "2021"
description = "Elixir preset schema and Vital preset import"
authors = ["Contrapunk Team"]

[dependencies]
elixir-core = { path = "../elixir-core", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
