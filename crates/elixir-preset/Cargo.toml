[package]
name = "elixir-preset"
version = "0.0.1"
edition = "2021"
description = "Persisted state and chapter examples for the Elixir foundations synthesizer"
authors = ["Contrapunk Team"]

[dependencies]
elixir-core = { path = "../elixir-core", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
