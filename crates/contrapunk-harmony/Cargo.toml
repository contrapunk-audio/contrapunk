[package]
name = "contrapunk-harmony"
version = "1.1.0"
edition = "2021"
description = "Harmony engine: keys, modes, voice leading, counterpoint, key detection"
authors = ["Contrapunk Team"]

[lib]
name = "contrapunk_harmony"
path = "src/lib.rs"

[dependencies]
contrapunk-dsp = { path = "../contrapunk-dsp" }
wmidi = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
