[workspace]
members = [".", "src-tauri", "wasm"]
resolver = "2"

[package]
name = "contrapunk"
version = "0.1.0"
edition = "2021"
description = "Real-time MIDI harmony generation"
authors = ["Contrapunk Team"]

[lib]
name = "contrapunk"
path = "src/lib.rs"

[[bin]]
name = "contrapunk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
wmidi = "4.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = "0.10"
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "MidiAccess", "MidiOptions", "MidiInput", "MidiOutput", "MidiPort", "MidiMessageEvent"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = false
strip = true
panic = "abort"
