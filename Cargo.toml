[workspace]
members = [".", "src-tauri", "wasm"]
resolver = "2"

[package]
name = "contrapunk"
version = "0.1.0"
edition = "2021"
description = "Real-time MIDI harmony generation"
authors = ["Contrapunk Team"]

[lib]
name = "contrapunk"
path = "src/lib.rs"

[[bin]]
name = "contrapunk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
wmidi = "4.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[features]
default = []
web-midi = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys", "getrandom"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = "0.10"
clap = { version = "4", features = ["derive"] }

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.web-sys]
version = "0.3"
features = ["Window", "Navigator", "MidiAccess", "MidiOptions", "MidiInput", "MidiOutput", "MidiPort", "MidiMessageEvent"]
optional = true

[dependencies.getrandom]
version = "0.2"
features = ["js"]
optional = true

[profile.release]
opt-level = "s"
lto = false
strip = true
panic = "abort"
