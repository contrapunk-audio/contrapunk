[package]
name = "contrapunk_plugin"
version = "1.3.0"
edition = "2021"
description = "Contrapunk VST3/CLAP plugin — real-time counterpoint harmony"
authors = ["Contrapunk Team"]

[features]
default = []
embed-ui = []
# Build variant used only as the embedded CLAP inside the AUv2 wrapper.
# Logic can still show its generic parameter UI, while VST3/CLAP keep the
# embedded Svelte editor through the normal embed-ui build.
au-generic-ui = []

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/contrapunk-audio/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_webview = { git = "https://github.com/contrapunk-audio/nih-plug-webview.git" }
contrapunk = { path = ".." }
contrapunk-companion = { path = "../crates/contrapunk-companion" }
contrapunk-transport = { path = "../crates/contrapunk-transport" }
wmidi = "4.0"
serde_json = "1.0"
ringbuf = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
midir = "0.11"
