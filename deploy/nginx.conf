server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types for WASM and web assets
    types {
        application/wasm wasm;
        application/javascript js mjs;
        text/html html;
        text/css css;
        application/json json;
        image/svg+xml svg;
        font/woff2 woff2;
        font/woff woff;
    }

    # Gzip compression
    gzip on;
    gzip_types application/wasm application/javascript text/html text/css application/json image/svg+xml;
    gzip_min_length 256;

    # Cache immutable hashed assets (Vite includes content hash in filenames)
    location ~* \.(wasm|js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
