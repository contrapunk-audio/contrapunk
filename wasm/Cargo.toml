[package]
name = "contrapunk-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bridge for Contrapunk harmony engine"
authors = ["Contrapunk Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
contrapunk = { path = ".." }
contrapunk-companion = { path = "../crates/contrapunk-companion" }
contrapunk-harmony = { path = "../crates/contrapunk-harmony" }
contrapunk-transport = { path = "../crates/contrapunk-transport" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }
wmidi = "4.0"
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
# rand 0.10 pulls in getrandom 0.4; enable wasm_js so wasm32-unknown-unknown compiles
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
